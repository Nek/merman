[package]
name = "merman-export"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Bounded PNG, JPEG, and PDF export for terminally validated Merman SVG."
documentation = "https://docs.rs/merman-export"
readme = "README.md"
keywords = ["mermaid", "svg", "png", "jpeg", "pdf"]
categories = ["encoding", "graphics"]

[package.metadata.merman]
artifact-profile-required = true

[features]
default = []
text = ["dep:skera", "dep:write-fonts", "dep:cssparser", "dep:simplecss", "dep:svgtypes", "dep:merman-render", "dep:quick-xml", "dep:roxmltree", "dep:rustybuzz", "dep:unicase", "dep:usvg"]
png = [
    "dep:cssparser",
    "dep:data-url",
    "dep:merman-core",
    "dep:merman-render",
    "dep:quick-xml",
    "dep:resvg",
    "dep:svgtypes",
    "dep:thiserror",
    "dep:tiny-skia",
    "dep:unicase",
    "dep:usvg",
]
jpeg = [
    "dep:cssparser",
    "dep:data-url",
    "dep:image",
    "dep:merman-core",
    "dep:merman-render",
    "dep:quick-xml",
    "dep:resvg",
    "dep:svgtypes",
    "dep:thiserror",
    "dep:tiny-skia",
    "dep:unicase",
    "dep:usvg",
]
pdf = [
    "dep:data-url",
    "dep:krilla",
    "dep:krilla-svg",
    "dep:merman-core",
    "dep:merman-render",
    "dep:quick-xml",
    "dep:thiserror",
    "dep:unicase",
    "dep:usvg",
]

[dependencies]
skera = { version = "=0.8.0", optional = true }
write-fonts = { version = "=0.54.0", features = ["read"], default-features = false, optional = true }
simplecss = { version = "0.2.2", optional = true }
cssparser = { workspace = true, optional = true }
data-url = { workspace = true, optional = true }
image = { workspace = true, optional = true }
krilla = { workspace = true, optional = true }
krilla-svg = { workspace = true, optional = true }
merman-core = { workspace = true, optional = true }
merman-render = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
roxmltree = { workspace = true, optional = true }
rustybuzz = { workspace = true, optional = true }
resvg = { workspace = true, optional = true, features = ["raster-images"] }
svgtypes = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tiny-skia = { workspace = true, optional = true }
unicase = { workspace = true, optional = true }
usvg = { workspace = true, optional = true, features = ["system-fonts", "text"] }

[dev-dependencies]
base64.workspace = true
png.workspace = true
